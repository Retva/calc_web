<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    $FLUTTER_BASE_HREF подставляется при сборке (flutter build web --base-href).
    Для локального запуска остаётся "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Калькулятор и конвертер валют на Flutter Web">

  <title>Калькулятор и конвертер</title>
  <link rel="manifest" href="manifest.json">
  <!-- Цвет «бумаги» до загрузки Flutter, чтобы не было белой вспышки. -->
  <style>
    body { margin: 0; background: #F3EEE3; }
    @media (prefers-color-scheme: dark) { body { background: #141619; } }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

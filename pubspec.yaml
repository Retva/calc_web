name: calc_web
description: "ПР1. Калькулятор и конвертер валют на Flutter Web: маршрутизация, формы и URL как состояние."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: ^17.5.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Шрифты лежат в проекте, а не подгружаются из Google Fonts:
  # приложение выглядит одинаково и без доступа к интернету.
  # Лицензии — assets/fonts/OFL-*.txt (SIL Open Font License 1.1).
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Unbounded-ExtraBold.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
